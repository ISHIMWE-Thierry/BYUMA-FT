name: Build and publish Byuma FT

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /Byuma-FT-Lite/
          # Set these under Settings -> Secrets and variables -> Actions.
          # A Firebase web config is public by design — it ships inside the
          # page either way — so repository *variables* are the right home
          # for it; firestore.rules is what actually guards the data.
          VITE_FB_API_KEY: ${{ vars.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN: ${{ vars.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_PROJECT_ID: ${{ vars.VITE_FB_PROJECT_ID }}
          VITE_FB_STORAGE_BUCKET: ${{ vars.VITE_FB_STORAGE_BUCKET }}
          VITE_FB_SENDER_ID: ${{ vars.VITE_FB_SENDER_ID }}
          VITE_FB_APP_ID: ${{ vars.VITE_FB_APP_ID }}
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: app/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
