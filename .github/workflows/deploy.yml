name: Build and publish Byuma FT

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

      # The Firebase config, taken from repository variables or, if that is
      # where they were put, from secrets. A web app's config is public by
      # design — it ships inside the page either way — so variables are the
      # better home; firestore.rules is what actually guards the data. Both
      # are accepted so a build never fails over which list they landed in.
      - name: Read the Firebase config
        id: fb
        env:
          API_KEY: ${{ vars.VITE_FB_API_KEY || secrets.VITE_FB_API_KEY }}
          AUTH_DOMAIN: ${{ vars.VITE_FB_AUTH_DOMAIN || secrets.VITE_FB_AUTH_DOMAIN }}
          PROJECT_ID: ${{ vars.VITE_FB_PROJECT_ID || secrets.VITE_FB_PROJECT_ID }}
          STORAGE_BUCKET: ${{ vars.VITE_FB_STORAGE_BUCKET || secrets.VITE_FB_STORAGE_BUCKET }}
          SENDER_ID: ${{ vars.VITE_FB_SENDER_ID || secrets.VITE_FB_SENDER_ID }}
          APP_ID: ${{ vars.VITE_FB_APP_ID || secrets.VITE_FB_APP_ID }}
        run: |
          # The config can arrive two ways and either is enough: these
          # variables, or the FALLBACK block in src/lib/firebase.ts that
          # `npm run connect:firebase` fills in. Only look for variables
          # when that block is still holding placeholders — the word
          # PASTE_ also appears further down the file, in the test that
          # decides whether the app is configured at all.
          fallback=$(sed -n '/const FALLBACK/,/^}/p' src/lib/firebase.ts 2>/dev/null)
          if [ -z "$fallback" ] || printf '%s' "$fallback" | grep -q 'PASTE_'; then
            missing=""
            for name in API_KEY AUTH_DOMAIN PROJECT_ID SENDER_ID APP_ID; do
              if [ -z "${!name}" ]; then missing="$missing VITE_FB_$name"; fi
            done
            if [ -n "$missing" ]; then
              echo "::error::Missing Firebase config:$missing"
              echo "::error::Add them at Settings -> Secrets and variables -> Actions,"
              echo "::error::or run: cd app && npm run connect:firebase"
              echo "::error::Without them the published app cannot reach any account,"
              echo "::error::so this build is stopped rather than published broken."
              exit 1
            fi
          else
            echo "Firebase config is in src/lib/firebase.ts."
          fi
          {
            echo "api_key=$API_KEY"
            echo "auth_domain=$AUTH_DOMAIN"
            echo "project_id=$PROJECT_ID"
            echo "storage_bucket=$STORAGE_BUCKET"
            echo "sender_id=$SENDER_ID"
            echo "app_id=$APP_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /Byuma-FT-Lite/
          VITE_FB_API_KEY: ${{ steps.fb.outputs.api_key }}
          VITE_FB_AUTH_DOMAIN: ${{ steps.fb.outputs.auth_domain }}
          VITE_FB_PROJECT_ID: ${{ steps.fb.outputs.project_id }}
          VITE_FB_STORAGE_BUCKET: ${{ steps.fb.outputs.storage_bucket }}
          VITE_FB_SENDER_ID: ${{ steps.fb.outputs.sender_id }}
          VITE_FB_APP_ID: ${{ steps.fb.outputs.app_id }}
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: app/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
